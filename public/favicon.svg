      <stop offset="0%" stop-color="#FF4D42" />
      <stop offset="100%" stop-color="#D92D20" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Rounded Shield / Icon Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#elfaaGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />
  
  <!-- Stylized Sports Car Silhouette / ELFAA Monogram -->
  <g fill="#FFFFFF" filter="url(#glow)">
    <!-- Aerodynamic Roof & Windshield -->
    <path d="M19 28 C23 20, 27 19, 36 19 C42 19, 45 22, 49 28 L54 30 C56 31, 57 33, 57 35 L57 39 C57 40, 56 41, 54 41 L52 41 C51 38, 48 36, 45 36 C42 36, 39 38, 38 41 L26 41 C25 38, 22 36, 19 36 C16 36, 13 38, 12 41 L10 41 C8 41, 7 40, 7 39 L7 35 C7 33, 9 31, 11 30 Z" />
    <!-- Cabin Windows (Cutout Accent) -->
    <path d="M22 28 L34 28 C34 25, 33 22, 28 22 C24 22, 23 25, 22 28 Z" fill="#D92D20" fill-opacity="0.9" />
    <path d="M37 28 L46 28 C44 24, 42 22, 38 22 L37 22 Z" fill="#D92D20" fill-opacity="0.9" />
    <!-- Wheels -->
    <circle cx="19" cy="41" r="5" fill="#FFFFFF" />
    <circle cx="19" cy="41" r="2.5" fill="#D92D20" />
    <circle cx="45" cy="41" r="5" fill="#FFFFFF" />
    <circle cx="45" cy="41" r="2.5" fill="#D92D20" />
    <!-- Headlight & Taillight Accents -->
    <polygon points="53,32 56,33 55,35 52,34" fill="#FDE047" />
    <polygon points="8,32 11,33 11,35 8,34" fill="#FFA299" />
    <!-- Speed Lines Under Car -->
    <rect x="23" y="44" width="18" height="2" rx="1" fill="#FFFFFF" fill-opacity="0.8" />
